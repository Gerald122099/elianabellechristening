<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eliana Belle Marquez | Christening Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#c49a84;
  --paper:#fffaf7;
  --text:#6a4b3c;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(#fdf6f2,#f1e3db);
  min-height:100vh;
  overflow:hidden;
}

/* BOOK */
.book{
  width:min(90vw,820px);
  aspect-ratio:3/2;
  margin:auto;
  position:relative;
  perspective:2200px;
}
.book-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* COVER */
.hard-cover{
  position:absolute;
  inset:0;
  background:linear-gradient(45deg,#c49a84,#e6d5cd);
  border-radius:20px;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform-origin:left;
  transition:transform 1.3s cubic-bezier(.6,.05,.28,.91);
  z-index:20;
}
.hard-cover.open{transform:rotateY(-180deg)}
.hard-cover h1{
  font-family:"Dancing Script",cursive;
  font-size:2.6rem;
}
.open-btn{
  margin-top:20px;
  padding:12px 26px;
  border:none;
  border-radius:30px;
  background:#fff;
  color:#c49a84;
  font-weight:700;
  cursor:pointer;
}

/* PAGES */
.pages{
  position:absolute;
  inset:0;
}
.page{
  position:absolute;
  inset:0;
  background:var(--paper);
  border-radius:14px;
  padding:30px;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.6,.05,.28,.91);
  display:flex;
  align-items:center;
  justify-content:center;
}
.page.flipped{transform:rotateY(-180deg)}
.page h1{
  font-family:"Dancing Script",cursive;
  color:var(--accent);
}

/* CONTROLS */
.controls{
  position:fixed;
  bottom:25px;
  display:flex;
  gap:14px;
}
.controls button{
  width:48px;height:48px;
  border:none;border-radius:50%;
  background:var(--accent);
  color:#fff;font-size:18px;
  cursor:pointer;
}
.controls button:disabled{opacity:.4}

/* MUSIC */
.music-toggle{
  position:fixed;
  top:20px;right:20px;
  width:50px;height:50px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:#fff;font-size:18px;
}

/* FIREWORKS */
.fireworks{
  position:fixed;
  inset:0;
  pointer-events:none;
}
.spark{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  animation:explode 1s ease-out forwards;
}
@keyframes explode{
  from{transform:translate(0,0);opacity:1}
  to{
    transform:translate(var(--x),var(--y));
    opacity:0;
  }
}
</style>
</head>

<body>

<!-- MUSIC -->
<button class="music-toggle" onclick="toggleMusic()">
  <i class="fas fa-music"></i>
</button>
<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_97e9d37c58.mp3">
</audio>

<div class="book-container">
<div class="book">

<!-- COVER -->
<div class="hard-cover" id="cover">
  <h1>Eliana Belle Marquez</h1>
  <p>Christening Invitation</p>
  <button class="open-btn" onclick="openBook()">Open Invitation</button>
</div>

<!-- PAGES -->
<div class="pages" id="pages">
  <div class="page"><h1>Hope to see you there!</h1></div>
  <div class="page"><h1>Health Protocol</h1></div>
  <div class="page"><h1>Dress Code & Gifts</h1></div>
  <div class="page"><h1>January 31, 2026<br>11:00 AM</h1></div>
</div>

</div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="prevPage()" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
  <button onclick="nextPage()" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
</div>

<div class="fireworks" id="fireworks"></div>

<script>
const pages=[...document.querySelectorAll(".page")];
const cover=document.getElementById("cover");
const bgm=document.getElementById("bgm");
const fireworks=document.getElementById("fireworks");

let page=0,open=false,playing=false;

pages.forEach((p,i)=>p.style.zIndex=pages.length-i);

function openBook(){
  cover.classList.add("open");
  open=true;
}

function nextPage(){
  if(page<pages.length){
    pages[page]?.classList.add("flipped");
    page++;
    if(page===pages.length){
      fireworksShow();
      setTimeout(closeBook,2500);
    }
  }
}

function prevPage(){
  if(page>0){
    page--;
    pages[page].classList.remove("flipped");
  }
}

/* CLOSE COVER & RESET */
function closeBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  page=0;
  cover.classList.remove("open");
}

/* MUSIC */
function toggleMusic(){
  if(!playing){
    bgm.volume=0.4;
    bgm.play().catch(()=>{});
  }else bgm.pause();
  playing=!playing;
}

/* FIREWORKS */
function fireworksShow(){
  for(let i=0;i<120;i++){
    const s=document.createElement("div");
    s.className="spark";
    s.style.left="50%";
    s.style.top="50%";
    s.style.background=`hsl(${Math.random()*360},90%,70%)`;
    s.style.setProperty("--x",`${(Math.random()-.5)*400}px`);
    s.style.setProperty("--y",`${(Math.random()-.5)*400}px`);
    fireworks.appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }
}
</script>

</body>
</html>
