<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eliana Belle Marquez | Christening Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --accent:#c49a84;
  --paper:#fffaf7;
  --text:#6a4b3c;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Poppins,sans-serif;
  background:linear-gradient(#fdf6f2,#f1e3db);
  min-height:100vh;
  overflow:hidden;
}

/* BOOK */
.book-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.book{
  width:min(90vw,820px);
  aspect-ratio:3/2;
  max-height:75vh;
  position:relative;
  perspective:2200px;
}

/* COVER */
.hard-cover{
  position:absolute;
  inset:0;
  background:linear-gradient(45deg,#c49a84,#e6d5cd);
  border-radius:20px;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform-origin:left;
  transition:transform 1.3s cubic-bezier(.6,.05,.28,.91);
  z-index:20;
}
.hard-cover.open{transform:rotateY(-180deg)}
.hard-cover h1{
  font-family:"Dancing Script",cursive;
  font-size:2.6rem;
}
.open-btn{
  margin-top:20px;
  padding:12px 26px;
  border:none;
  border-radius:30px;
  background:#fff;
  color:#c49a84;
  font-weight:700;
  cursor:pointer;
}

/* PAGES */
.pages{
  position:absolute;
  inset:0;
}
.page{
  position:absolute;
  inset:0;
  background:var(--paper);
  border-radius:14px;
  padding:30px;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.6,.05,.28,.91);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.page::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to right,rgba(0,0,0,.08),transparent 40%);
  pointer-events:none;
}
.page.flipped{transform:rotateY(-180deg)}
.page h1{
  font-family:"Dancing Script",cursive;
  color:var(--accent);
  font-size:2.2rem;
}

/* CONTROLS */
.controls{
  position:fixed;
  bottom:24px;
  display:flex;
  gap:14px;
  z-index:50;
}
.controls button{
  width:48px;height:48px;
  border:none;border-radius:50%;
  background:var(--accent);
  color:#fff;font-size:18px;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,.2);
}
.controls button:disabled{opacity:.4}

/* MUSIC */
.music-toggle{
  position:fixed;
  top:20px;right:20px;
  width:50px;height:50px;
  border-radius:50%;
  border:none;
  background:var(--accent);
  color:#fff;font-size:18px;
  cursor:pointer;
}

/* CONFETTI */
.confetti-container{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
}
.confetti{
  position:absolute;
  width:10px;height:10px;
  top:-10px;
  animation:fall linear forwards;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<!-- MUSIC -->
<button class="music-toggle" onclick="toggleMusic()">
  <i class="fas fa-music"></i>
</button>
<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_97e9d37c58.mp3">
</audio>

<div class="book-container">
<div class="book">

<!-- COVER -->
<div class="hard-cover" id="cover">
  <h1>Eliana Belle Marquez</h1>
  <p>Christening Invitation</p>
  <button class="open-btn" onclick="openBook()">Open Invitation</button>
</div>

<!-- PAGES -->
<div class="pages">
  <div class="page"><h1>Hope to see you there!</h1></div>
  <div class="page"><h1>Health Protocol</h1></div>
  <div class="page"><h1>Dress Code & Gifts</h1></div>
  <div class="page"><h1>January 31, 2026<br>11:00 AM</h1></div>
</div>

</div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button onclick="prevPage()" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
  <button onclick="nextPage()" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
const pages=[...document.querySelectorAll(".page")];
const cover=document.getElementById("cover");
const bgm=document.getElementById("bgm");
const confettiBox=document.getElementById("confetti");

let page=0,open=false,playing=false;

pages.forEach((p,i)=>p.style.zIndex=pages.length-i);

/* OPEN */
function openBook(){
  cover.classList.add("open");
  open=true;
}

/* NEXT */
function nextPage(){
  if(page<pages.length){
    pages[page]?.classList.add("flipped");
    page++;
    if(page===pages.length){
      launchConfetti(80);
      setTimeout(closeBook,2500);
    }
  }
}

/* PREV */
function prevPage(){
  if(page>0){
    page--;
    pages[page].classList.remove("flipped");
  }
}

/* CLOSE & RESET */
function closeBook(){
  pages.forEach(p=>p.classList.remove("flipped"));
  page=0;
  cover.classList.remove("open");
}

/* MUSIC */
function toggleMusic(){
  if(!playing){
    bgm.volume=0.4;
    bgm.play().catch(()=>{});
  }else bgm.pause();
  playing=!playing;
}

/* CONFETTI */
function launchConfetti(count){
  for(let i=0;i<count;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},80%,70%)`;
    c.style.animationDuration=2+Math.random()*2+"s";
    if(Math.random()>.6){
      c.style.borderRadius="50%";
      c.style.width="8px";
      c.style.height="8px";
    }
    confettiBox.appendChild(c);
    setTimeout(()=>c.remove(),3000);
  }
}

/* SWIPE */
let startX=0;
document.addEventListener("touchstart",e=>startX=e.touches[0].screenX);
document.addEventListener("touchend",e=>{
  const endX=e.changedTouches[0].screenX;
  if(endX<startX-50)nextPage();
  if(endX>startX+50)prevPage();
});

/* CLICK SOUND UNLOCK */
document.addEventListener("click",()=>bgm.play().catch(()=>{}),{once:true});
</script>

</body>
</html>
